<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Fabric — Device Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E1420;
  --bg-glow-1: #1B2A44;
  --bg-glow-2: #1A2438;
  --panel: #16202F;
  --panel-raised: #1C283A;
  --border: #263248;
  --text: #E6EBF2;
  --text-muted: #8A97AB;
  --brand: #6C9BFF;
  --up: #3ED598;
  --down: #F2A93B;
  --up-dim: #234036;
  --down-dim: #3E3120;
  --focus: #6C9BFF;
  --wire: #2E3D57;

  --c-arista: #2BD1B0;
  --c-nex9k: #6C8CFF;
  --c-r1: #F2668F;
  --c-sw2: #C79CFF;
}

:root:not([data-theme="light"]) { color-scheme: dark; }

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F3F5F8;
    --bg-glow-1: #FFFFFF;
    --bg-glow-2: #FFFFFF;
    --panel: #FFFFFF;
    --panel-raised: #FBFCFD;
    --border: #DCE2EA;
    --text: #16202F;
    --text-muted: #64728A;
    --brand: #3A66D8;
    --up: #1B9E6B;
    --down: #B66E14;
    --up-dim: #E4F5EC;
    --down-dim: #FBEDDA;
    --wire: #C7D0DD;
    --c-arista: #0FA88A;
    --c-nex9k: #4A69E0;
    --c-r1: #D6437A;
    --c-sw2: #8A5FD6;
  }
}

:root[data-theme="light"] {
  --bg: #F3F5F8;
  --bg-glow-1: #FFFFFF;
  --bg-glow-2: #FFFFFF;
  --panel: #FFFFFF;
  --panel-raised: #FBFCFD;
  --border: #DCE2EA;
  --text: #16202F;
  --text-muted: #64728A;
  --brand: #3A66D8;
  --up: #1B9E6B;
  --down: #B66E14;
  --up-dim: #E4F5EC;
  --down-dim: #FBEDDA;
  --wire: #C7D0DD;
  --c-arista: #0FA88A;
  --c-nex9k: #4A69E0;
  --c-r1: #D6437A;
  --c-sw2: #8A5FD6;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 900px 500px at 12% -10%, var(--bg-glow-1) 0%, transparent 60%),
    radial-gradient(ellipse 800px 500px at 100% 10%, var(--bg-glow-2) 0%, transparent 55%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  -webkit-font-smoothing: antialiased;
}

.headline, h1, h2, h3, .tile-name, .nav-btn, .stat-label, .node-label, .hub-label {
  font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 40px 28px 80px;
}

header.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}

.title-row {
  display: flex;
  align-items: center;
  gap: 14px;
}

.signal-mark {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 26px;
}
.signal-mark span {
  display: block;
  width: 5px;
  border-radius: 2px;
}

h1.headline {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
  color: var(--text);
}

.subhead {
  color: var(--text-muted);
  font-size: 14px;
  margin: 0;
  max-width: 46ch;
  line-height: 1.5;
}

.pull-info {
  text-align: right;
  color: var(--text-muted);
  font-size: 12.5px;
  line-height: 1.6;
}

.pull-info strong { color: var(--text); font-weight: 500; }

/* topology hero */
.topo-panel {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 8px 4px;
  margin-bottom: 28px;
  overflow: hidden;
}

.topo-panel svg { display: block; width: 100%; height: auto; position: relative; z-index: 1; }
.topo-panel img { display: block; width: 100%; height: auto; border-radius: 8px; background: #fff; }

.wire { stroke: var(--wire); stroke-width: 1.5; fill: none; }

.wire-pulse {
  stroke-dasharray: 5 7;
  animation: dash 22s linear infinite;
  opacity: 0.7;
}

@keyframes dash { to { stroke-dashoffset: -240; } }

.hub-ring { fill: var(--panel-raised); stroke: var(--border); stroke-width: 1.5; }
.hub-label { fill: var(--text); font-size: 11px; font-weight: 600; }
.hub-sub { fill: var(--text-muted); font-size: 9px; font-family: 'IBM Plex Mono', monospace; }

.node-ring-bg { fill: none; stroke-width: 4; }
.node-core { stroke-width: 1.5; }
.node-label { fill: var(--text); font-size: 12px; font-weight: 600; }
.node-sub { fill: var(--text-muted); font-size: 9.5px; font-family: 'IBM Plex Mono', monospace; }
.node-pct { font-size: 9px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; }

/* stat strip */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 32px;
}

.stat {
  background: var(--panel);
  padding: 16px 20px 18px;
  border-top: 3px solid transparent;
}

.stat-value {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.1;
}

.stat-label {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 4px;
  font-weight: 500;
}

/* device tiles */
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
  gap: 14px;
  margin-bottom: 8px;
}

.tile {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 18px 16px 20px;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
  font-family: inherit;
  display: flex;
  gap: 14px;
  align-items: center;
  overflow: hidden;
}

.tile::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--accent-color, var(--up));
}

.tile:hover { background: var(--panel-raised); }

.tile.selected {
  outline: 2px solid var(--brand);
  outline-offset: -1px;
}

.tile:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.tile-donut { flex-shrink: 0; }

.tile-body { flex: 1; min-width: 0; }

.tile-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
  gap: 8px;
}

.tile-name { font-size: 17px; font-weight: 600; }

.vendor-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-family: 'IBM Plex Mono', monospace;
  flex-shrink: 0;
  padding: 3px 8px 3px 6px;
  border-radius: 20px;
  background: var(--badge-bg);
  color: var(--badge-fg);
}

.vendor-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

.tile-model {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-bottom: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tile-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--text-muted);
}

.tile-ip { color: var(--text); }

/* detail panel */
.detail {
  margin-top: 32px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  border-top: 3px solid var(--accent-color, var(--brand));
}

.detail-head {
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  flex-wrap: wrap;
}

.detail-title-row { display: flex; align-items: center; gap: 10px; }

.detail-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 21px;
  font-weight: 700;
  margin: 0;
}

.status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.status-dot.up { background: var(--up); }
.status-dot.down { background: var(--down); }

.detail-facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px 28px;
  margin-top: 12px;
  font-size: 12.5px;
}

.fact-label { color: var(--text-muted); margin-bottom: 3px; }
.fact-value { color: var(--text); word-break: break-word; }

.detail-controls { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

.chip-group {
  display: flex;
  gap: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 3px;
}

.chip {
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
}

.chip.active { background: var(--panel-raised); color: var(--text); box-shadow: 0 0 0 1px var(--border) inset; }

.search-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  padding: 8px 12px;
  width: 170px;
}

.search-input:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
.search-input::placeholder { color: var(--text-muted); }

.table-scroll { max-height: 480px; overflow-y: auto; }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

thead th {
  position: sticky;
  top: 0;
  background: var(--panel-raised);
  text-align: left;
  padding: 10px 20px;
  color: var(--text-muted);
  font-weight: 500;
  border-bottom: 1px solid var(--border);
  z-index: 1;
}

tbody td { padding: 9px 20px; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--panel-raised); }

.iface-name { font-weight: 500; }
.status-cell { display: flex; align-items: center; gap: 7px; }
.status-text.up { color: var(--up); }
.status-text.down { color: var(--down); }
.dim { color: var(--text-muted); }

.empty-row td { text-align: center; padding: 32px; color: var(--text-muted); }

footer { margin-top: 28px; text-align: center; color: var(--text-muted); font-size: 11.5px; }

@media (max-width: 640px) {
  .wrap { padding: 24px 16px 60px; }
  .stat-strip { grid-template-columns: repeat(2, 1fr); }
  header.top { flex-direction: column; align-items: flex-start; }
  .pull-info { text-align: left; }
  .detail-head { flex-direction: column; }
  .search-input { width: 140px; }
  thead th, tbody td { padding: 8px 12px; }
  .tile { flex-direction: column; align-items: flex-start; }
}
</style>
</head>

const deviceNames = Object.keys(DEVICES);
let selected = null;
let filterMode = 'all';
let searchTerm = '';

const DEVICE_COLOR_VAR = {
  'Arista': '--c-arista',
  'Nex9K': '--c-nex9k',
  'R1': '--c-r1',
  'SW2': '--c-sw2'
};

function deviceColor(name) {
  const varName = DEVICE_COLOR_VAR[name] || '--brand';
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

function fmtUptime(sec) {
  if (sec < 0) return 'n/a (lab clock)';
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const parts = [];
  if (d) parts.push(d + 'd');
  if (h || d) parts.push(h + 'h');
  parts.push(m + 'm');
  return parts.join(' ');
}

function ifaceCounts(iface) {
  const vals = Object.values(iface);
  const up = vals.filter(i => i.is_up).length;
  return { total: vals.length, up: up, down: vals.length - up };
}

function primaryIp(dev) {
  const ipMap = dev.data.interfaces_ip;
  for (const ifaceName in ipMap) {
    const v4 = ipMap[ifaceName].ipv4;
    if (v4) {
      const first = Object.keys(v4)[0];
      if (first) return first;
    }
  }
  return dev.ip;
}

function hexToRgba(hex, alpha) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function donutSvg(pct, ringColor, size) {
  size = size || 52;
  const r = size / 2 - 4;
  const c = size / 2;
  const circ = 2 * Math.PI * r;
  const filled = (pct / 100) * circ;
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="tile-donut">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--border)" stroke-width="4"></circle>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${ringColor}" stroke-width="4"
        stroke-dasharray="${filled} ${circ - filled}" stroke-linecap="round"
        transform="rotate(-90 ${c} ${c})"></circle>
      <text x="${c}" y="${c + 4}" text-anchor="middle" class="node-pct" fill="var(--text)">${pct}%</text>
    </svg>
  `;
}

function renderSignalMark() {
  const heights = [10, 18, 14, 24];
  const el = document.getElementById('signalMark');
  el.innerHTML = deviceNames.map((name, i) => {
    const col = deviceColor(name);
    return `<span style="height:${heights[i % 4]}px;background:${col}"></span>`;
  }).join('');
}

function renderTopology() {
  const w = 1000, h = 260;
  const hubX = w / 2, hubY = h / 2;
  const positions = [
    { x: hubX, y: 48 },
    { x: w - 150, y: hubY },
    { x: hubX, y: h - 40 },
    { x: 150, y: hubY },
  ];

  let glow = '', wires = '', nodes = '';

  deviceNames.forEach((name, i) => {
    const dev = DEVICES[name];
    const facts = dev.data.facts;
    const c = ifaceCounts(dev.data.interfaces);
    const pct = c.total ? Math.round((c.up / c.total) * 100) : 0;
    const pos = positions[i] || { x: hubX, y: hubY };
    const col = deviceColor(name);
    const statusColor = c.down === 0 ? 'var(--up)' : 'var(--down)';

    wires += `<path class="wire wire-pulse" d="M ${hubX} ${hubY} L ${pos.x} ${pos.y}" style="animation-delay:${i * -3}s; stroke:${col}"></path>`;
    wires += `<path class="wire" d="M ${hubX} ${hubY} L ${pos.x} ${pos.y}"></path>`;

    const r = 30;
    const circ = 2 * Math.PI * r;
    const filled = (pct / 100) * circ;
    const labelY = pos.y + (pos.y <= h/2 ? -44 : 50);

  const svg = `
    <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network topology of lab devices">
      <defs><filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"></feGaussianBlur></filter></defs>
      ${glow}
      ${wires}
      <circle cx="${hubX}" cy="${hubY}" r="34" class="hub-ring"></circle>
      <text x="${hubX}" y="${hubY - 4}" text-anchor="middle" class="hub-label">mgmt</text>
      <text x="${hubX}" y="${hubY + 10}" text-anchor="middle" class="hub-sub">184.0/24</text>
      ${nodes}
    </svg>
  `;
  document.getElementById('topoPanel').innerHTML = svg;
}

function renderStats() {
  let totalUp = 0, totalDown = 0;
  const vendors = new Set();
  deviceNames.forEach(name => {
    const c = ifaceCounts(DEVICES[name].data.interfaces);
    totalUp += c.up; totalDown += c.down;
    vendors.add(DEVICES[name].data.facts.vendor);
  });

  const stats = [
    { label: 'Devices reporting', value: deviceNames.length, color: 'var(--c-nex9k)' },
    { label: 'Interfaces up', value: totalUp, color: 'var(--up)' },
    { label: 'Interfaces down', value: totalDown, color: 'var(--down)' },
    { label: 'Vendors in fabric', value: vendors.size, color: 'var(--c-sw2)' },
  ];

  document.getElementById('statStrip').innerHTML = stats.map(s => `
    <div class="stat" style="border-top-color:${s.color}">
      <div class="stat-value" style="color:${s.color}">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join('');
}

function renderTiles() {
  const html = deviceNames.map(name => {
    const dev = DEVICES[name];
    const facts = dev.data.facts;
    const c = ifaceCounts(dev.data.interfaces);
    const pct = c.total ? Math.round((c.up / c.total) * 100) : 0;
    const hasDown = c.down > 0;
    const isSel = selected === name;
    const statusColor = hasDown ? 'var(--down)' : 'var(--up)';
    const col = deviceColor(name);

    return `
      <button class="tile ${isSel ? 'selected' : ''}" data-name="${name}" style="--accent-color:${statusColor}">
        ${donutSvg(pct, statusColor, 52)}
        <div class="tile-body">
          <div class="tile-top">
            <span class="tile-name">${facts.hostname}</span>
            <span class="vendor-badge" style="--badge-bg:${hexToRgba(col, 0.16)}; --badge-fg:${col}">
              <span class="vendor-dot"></span>${facts.vendor}
            </span>
          </div>
          <div class="tile-model">${facts.model}</div>
          <div class="tile-meta">
            <span class="tile-ip">${primaryIp(dev)}</span>
            <span>${fmtUptime(facts.uptime)}</span>
          </div>
        </div>
      </button>
    `;
  }).join('');

  document.getElementById('tiles').innerHTML = html;

  document.querySelectorAll('.tile').forEach(btn => {
    btn.addEventListener('click', () => {
      selected = btn.dataset.name;
      renderTiles();
      renderDetail();
      document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
}

function ipFor(devIfaces, ifaceName) {
  const entry = devIfaces[ifaceName];
  if (!entry) return '';
  const v4 = entry.ipv4;
  if (!v4) return '';
  return Object.keys(v4).map(ip => ip + '/' + v4[ip].prefix_length).join(', ');
}

function renderDetail() {
  const container = document.getElementById('detail');
  if (!selected) { container.innerHTML = ''; container.style.borderTopColor = 'transparent'; return; }

  const dev = DEVICES[selected];
  const facts = dev.data.facts;
  const ifaces = dev.data.interfaces;
  const ipMap = dev.data.interfaces_ip;
  const c = ifaceCounts(ifaces);
  const col = deviceColor(selected);

  container.style.setProperty('--accent-color', col);

  let rows = Object.keys(ifaces).map(name => ({ name, ...ifaces[name] }));

  if (filterMode === 'up') rows = rows.filter(r => r.is_up);
  if (filterMode === 'down') rows = rows.filter(r => !r.is_up);
  if (searchTerm) {
    const t = searchTerm.toLowerCase();
    rows = rows.filter(r => r.name.toLowerCase().includes(t));
  }

  rows.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

  const rowsHtml = rows.length ? rows.map(r => {
    const ip = ipFor(ipMap, r.name);
    return `
      <tr>
        <td class="iface-name">${r.name}</td>
        <td>
          <span class="status-cell">
            <span class="status-dot ${r.is_up ? 'up' : 'down'}"></span>
            <span class="status-text ${r.is_up ? 'up' : 'down'}">${r.is_up ? 'up' : 'down'}</span>
          </span>
        </td>
        <td class="${ip ? '' : 'dim'}">${ip || '—'}</td>
        <td class="dim">${r.mac_address || '—'}</td>
        <td class="dim">${r.mtu}</td>
        <td class="dim">${r.speed ? r.speed + ' Mb/s' : '—'}</td>
      </tr>
    `;
  }).join('') : `<tr class="empty-row"><td colspan="6">No interfaces match this filter.</td></tr>`;

  container.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-title-row">
          <span class="status-dot ${c.down === 0 ? 'up' : 'down'}"></span>
          <h2 class="detail-title">${facts.hostname}</h2>
          <span class="vendor-badge" style="--badge-bg:${hexToRgba(col, 0.16)}; --badge-fg:${col}">
            <span class="vendor-dot"></span>${facts.vendor}
          </span>
        </div>
        <div class="detail-facts">
          <div><div class="fact-label">Vendor / model</div><div class="fact-value">${facts.vendor} — ${facts.model}</div></div>
          <div><div class="fact-label">OS version</div><div class="fact-value">${facts.os_version}</div></div>
          <div><div class="fact-label">Serial</div><div class="fact-value">${facts.serial_number}</div></div>
          <div><div class="fact-label">FQDN</div><div class="fact-value">${facts.fqdn || '—'}</div></div>
          <div><div class="fact-label">Uptime</div><div class="fact-value">${fmtUptime(facts.uptime)}</div></div>
          <div><div class="fact-label">Management IP</div><div class="fact-value">${primaryIp(dev)}</div></div>
        </div>
      </div>
      <div class="detail-controls">
        <div class="chip-group">
          <button class="chip ${filterMode === 'all' ? 'active' : ''}" data-filter="all">All ${c.total}</button>
          <button class="chip ${filterMode === 'up' ? 'active' : ''}" data-filter="up">Up ${c.up}</button>
          <button class="chip ${filterMode === 'down' ? 'active' : ''}" data-filter="down">Down ${c.down}</button>
        </div>
        <input class="search-input" type="text" placeholder="Filter interface..." value="${searchTerm}" id="searchBox">
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>Interface</th><th>Status</th><th>IP address</th><th>MAC</th><th>MTU</th><th>Speed</th></tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;

  container.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      filterMode = chip.dataset.filter;
      renderDetail();
    });
  });

  const searchBox = document.getElementById('searchBox');
  searchBox.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderDetail();
    document.getElementById('searchBox').focus();
    const val = document.getElementById('searchBox').value;
    document.getElementById('searchBox').setSelectionRange(val.length, val.length);
  });
}

renderSignalMark();
renderStats();
selected = deviceNames.reduce((worst, name) => {
  const c = ifaceCounts(DEVICES[name].data.interfaces);
  if (!worst) return name;
  const worstDown = ifaceCounts(DEVICES[worst].data.interfaces).down;
  return c.down > worstDown ? name : worst;
}, null);
renderTiles();
renderDetail();
</script>
</body>
</html>
