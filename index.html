<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Fabric — Device Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #101826;
  --panel: #16202F;
  --panel-raised: #1C283A;
  --border: #263248;
  --text: #E6EBF2;
  --text-muted: #8A97AB;
  --brand: #6C9BFF;
  --up: #3ED598;
  --down: #F2A93B;
  --up-dim: #234036;
  --down-dim: #3E3120;
  --focus: #6C9BFF;
}

:root:not([data-theme="light"]) {
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F3F5F8;
    --panel: #FFFFFF;
    --panel-raised: #FBFCFD;
    --border: #DCE2EA;
    --text: #16202F;
    --text-muted: #64728A;
    --brand: #3A66D8;
    --up: #1B9E6B;
    --down: #B66E14;
    --up-dim: #E4F5EC;
    --down-dim: #FBEDDA;
  }
}

:root[data-theme="light"] {
  --bg: #F3F5F8;
  --panel: #FFFFFF;
  --panel-raised: #FBFCFD;
  --border: #DCE2EA;
  --text: #16202F;
  --text-muted: #64728A;
  --brand: #3A66D8;
  --up: #1B9E6B;
  --down: #B66E14;
  --up-dim: #E4F5EC;
  --down-dim: #FBEDDA;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  -webkit-font-smoothing: antialiased;
}

.headline, h1, h2, h3, .tile-name, .nav-btn, .stat-label {
  font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 40px 28px 80px;
}

header.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  margin-bottom: 36px;
  flex-wrap: wrap;
}

h1.headline {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
  color: var(--text);
}

.subhead {
  color: var(--text-muted);
  font-size: 14px;
  margin: 0;
  max-width: 46ch;
  line-height: 1.5;
}

.pull-info {
  text-align: right;
  color: var(--text-muted);
  font-size: 12.5px;
  line-height: 1.6;
}

.pull-info strong {
  color: var(--text);
  font-weight: 500;
}

/* stat strip */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 32px;
}

.stat {
  background: var(--panel);
  padding: 18px 20px;
}

.stat-value {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.1;
}

.stat-value.accent-up { color: var(--up); }
.stat-value.accent-down { color: var(--down); }

.stat-label {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 4px;
  font-weight: 500;
}

/* device tiles */
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
  gap: 14px;
  margin-bottom: 8px;
}

.tile {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--up);
  border-radius: 8px;
  padding: 18px 18px 16px;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  transition: border-color 120ms ease, background 120ms ease;
  font-family: inherit;
}

.tile:hover { background: var(--panel-raised); }

.tile.has-down { border-left-color: var(--down); }

.tile.selected {
  outline: 2px solid var(--brand);
  outline-offset: -1px;
}

.tile:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.tile-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}

.tile-name {
  font-size: 17px;
  font-weight: 600;
}

.tile-vendor {
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
}

.tile-model {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-bottom: 14px;
}

.tile-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.tile-bar {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: var(--down-dim);
  overflow: hidden;
  display: flex;
}

.tile-bar-fill {
  background: var(--up);
  height: 100%;
}

.tile-bar-label {
  font-size: 11.5px;
  color: var(--text-muted);
  white-space: nowrap;
}

.tile-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--text-muted);
}

.tile-ip { color: var(--text); }

/* detail panel */
.detail {
  margin-top: 32px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.detail-head {
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  flex-wrap: wrap;
}

.detail-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.detail-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 21px;
  font-weight: 700;
  margin: 0;
}

.status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.status-dot.up { background: var(--up); }
.status-dot.down { background: var(--down); }

.detail-facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px 28px;
  margin-top: 12px;
  font-size: 12.5px;
}

.fact-label {
  color: var(--text-muted);
  margin-bottom: 3px;
}

.fact-value {
  color: var(--text);
  word-break: break-word;
}

.detail-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}

.chip-group {
  display: flex;
  gap: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 3px;
}

.chip {
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
}

.chip.active {
  background: var(--panel-raised);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--border) inset;
}

.search-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  padding: 8px 12px;
  width: 170px;
}

.search-input:focus {
  outline: 2px solid var(--focus);
  outline-offset: -1px;
}

.search-input::placeholder { color: var(--text-muted); }

/* table */
.table-scroll {
  max-height: 480px;
  overflow-y: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}

thead th {
  position: sticky;
  top: 0;
  background: var(--panel-raised);
  text-align: left;
  padding: 10px 20px;
  color: var(--text-muted);
  font-weight: 500;
  border-bottom: 1px solid var(--border);
  z-index: 1;
}

tbody td {
  padding: 9px 20px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  white-space: nowrap;
}

tbody tr:last-child td { border-bottom: none; }

tbody tr:hover { background: var(--panel-raised); }

.iface-name { font-weight: 500; }

.status-cell { display: flex; align-items: center; gap: 7px; }

.status-text.up { color: var(--up); }
.status-text.down { color: var(--down); }

.dim { color: var(--text-muted); }

.empty-row td {
  text-align: center;
  padding: 32px;
  color: var(--text-muted);
}

footer {
  margin-top: 28px;
  text-align: center;
  color: var(--text-muted);
  font-size: 11.5px;
}

@media (max-width: 640px) {
  .wrap { padding: 24px 16px 60px; }
  .stat-strip { grid-template-columns: repeat(2, 1fr); }
  header.top { flex-direction: column; align-items: flex-start; }
  .pull-info { text-align: left; }
  .detail-head { flex-direction: column; }
  .search-input { width: 140px; }
  thead th, tbody td { padding: 8px 12px; }
}
</style>
</head>

const deviceNames = Object.keys(DEVICES);
let selected = null;
let filterMode = 'all';
let searchTerm = '';

function fmtUptime(sec) {
  if (sec < 0) return 'n/a (lab clock)';
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const parts = [];
  if (d) parts.push(d + 'd');
  if (h || d) parts.push(h + 'h');
  parts.push(m + 'm');
  return parts.join(' ');
}

function ifaceCounts(iface) {
  const vals = Object.values(iface);
  const up = vals.filter(i => i.is_up).length;
  return { total: vals.length, up: up, down: vals.length - up };
}

function primaryIp(dev) {
  const ipMap = dev.data.interfaces_ip;
  for (const ifaceName in ipMap) {
    const v4 = ipMap[ifaceName].ipv4;
    if (v4) {
      const first = Object.keys(v4)[0];
      if (first) return first;
    }
  }
  return dev.ip;
}

function renderStats() {
  let totalUp = 0, totalDown = 0, totalIfaces = 0;
  const vendors = new Set();
  deviceNames.forEach(name => {
    const c = ifaceCounts(DEVICES[name].data.interfaces);
    totalUp += c.up; totalDown += c.down; totalIfaces += c.total;
    vendors.add(DEVICES[name].data.facts.vendor);
  });

  const stats = [
    { label: 'Devices reporting', value: deviceNames.length, cls: '' },
    { label: 'Interfaces up', value: totalUp, cls: 'accent-up' },
    { label: 'Interfaces down', value: totalDown, cls: 'accent-down' },
    { label: 'Vendors in fabric', value: vendors.size, cls: '' },
  ];

  document.getElementById('statStrip').innerHTML = stats.map(s => `
    <div class="stat">
      <div class="stat-value ${s.cls}">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join('');
}

function renderTiles() {
  const html = deviceNames.map(name => {
    const dev = DEVICES[name];
    const facts = dev.data.facts;
    const c = ifaceCounts(dev.data.interfaces);
    const pct = c.total ? Math.round((c.up / c.total) * 100) : 0;
    const hasDown = c.down > 0;
    const isSel = selected === name;
    return `
      <button class="tile ${hasDown ? 'has-down' : ''} ${isSel ? 'selected' : ''}" data-name="${name}">
        <div class="tile-top">
          <span class="tile-name">${facts.hostname}</span>
          <span class="tile-vendor">${facts.vendor}</span>
        </div>
        <div class="tile-model">${facts.model}</div>
        <div class="tile-bar-row">
          <div class="tile-bar"><div class="tile-bar-fill" style="width:${pct}%"></div></div>
          <span class="tile-bar-label">${c.up}/${c.total} up</span>
        </div>
        <div class="tile-meta">
          <span class="tile-ip">${primaryIp(dev)}</span>
          <span>${fmtUptime(facts.uptime)}</span>
        </div>
      </button>
    `;
  }).join('');

  document.getElementById('tiles').innerHTML = html;

  document.querySelectorAll('.tile').forEach(btn => {
    btn.addEventListener('click', () => {
      selected = btn.dataset.name;
      renderTiles();
      renderDetail();
      document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
}

function ipFor(devIfaces, ifaceName) {
  const entry = devIfaces[ifaceName];
  if (!entry) return '';
  const v4 = entry.ipv4;
  if (!v4) return '';
  return Object.keys(v4).map(ip => ip + '/' + v4[ip].prefix_length).join(', ');
}

function renderDetail() {
  const container = document.getElementById('detail');
  if (!selected) { container.innerHTML = ''; return; }

  const dev = DEVICES[selected];
  const facts = dev.data.facts;
  const ifaces = dev.data.interfaces;
  const ipMap = dev.data.interfaces_ip;
  const c = ifaceCounts(ifaces);

  let rows = Object.keys(ifaces).map(name => ({ name, ...ifaces[name] }));

  if (filterMode === 'up') rows = rows.filter(r => r.is_up);
  if (filterMode === 'down') rows = rows.filter(r => !r.is_up);
  if (searchTerm) {
    const t = searchTerm.toLowerCase();
    rows = rows.filter(r => r.name.toLowerCase().includes(t));
  }

  rows.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

  const rowsHtml = rows.length ? rows.map(r => {
    const ip = ipFor(ipMap, r.name);
    return `
      <tr>
        <td class="iface-name">${r.name}</td>
        <td>
          <span class="status-cell">
            <span class="status-dot ${r.is_up ? 'up' : 'down'}"></span>
            <span class="status-text ${r.is_up ? 'up' : 'down'}">${r.is_up ? 'up' : 'down'}</span>
          </span>
        </td>
        <td class="${ip ? '' : 'dim'}">${ip || '—'}</td>
        <td class="dim">${r.mac_address || '—'}</td>
        <td class="dim">${r.mtu}</td>
        <td class="dim">${r.speed ? r.speed + ' Mb/s' : '—'}</td>
      </tr>
    `;
  }).join('') : `<tr class="empty-row"><td colspan="6">No interfaces match this filter.</td></tr>`;

  container.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-title-row">
          <span class="status-dot ${c.down === 0 ? 'up' : 'down'}"></span>
          <h2 class="detail-title">${facts.hostname}</h2>
        </div>
        <div class="detail-facts">
          <div><div class="fact-label">Vendor / model</div><div class="fact-value">${facts.vendor} — ${facts.model}</div></div>
          <div><div class="fact-label">OS version</div><div class="fact-value">${facts.os_version}</div></div>
          <div><div class="fact-label">Serial</div><div class="fact-value">${facts.serial_number}</div></div>
          <div><div class="fact-label">FQDN</div><div class="fact-value">${facts.fqdn || '—'}</div></div>
          <div><div class="fact-label">Uptime</div><div class="fact-value">${fmtUptime(facts.uptime)}</div></div>
          <div><div class="fact-label">Management IP</div><div class="fact-value">${primaryIp(dev)}</div></div>
        </div>
      </div>
      <div class="detail-controls">
        <div class="chip-group">
          <button class="chip ${filterMode === 'all' ? 'active' : ''}" data-filter="all">All ${c.total}</button>
          <button class="chip ${filterMode === 'up' ? 'active' : ''}" data-filter="up">Up ${c.up}</button>
          <button class="chip ${filterMode === 'down' ? 'active' : ''}" data-filter="down">Down ${c.down}</button>
        </div>
        <input class="search-input" type="text" placeholder="Filter interface..." value="${searchTerm}" id="searchBox">
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>Interface</th><th>Status</th><th>IP address</th><th>MAC</th><th>MTU</th><th>Speed</th></tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;

  container.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      filterMode = chip.dataset.filter;
      renderDetail();
    });
  });

  const searchBox = document.getElementById('searchBox');
  searchBox.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderDetail();
    document.getElementById('searchBox').focus();
    const val = document.getElementById('searchBox').value;
    document.getElementById('searchBox').setSelectionRange(val.length, val.length);
  });
}

renderStats();
renderTiles();
selected = deviceNames.reduce((worst, name) => {
  const c = ifaceCounts(DEVICES[name].data.interfaces);
  if (!worst) return name;
  const worstDown = ifaceCounts(DEVICES[worst].data.interfaces).down;
  return c.down > worstDown ? name : worst;
}, null);
renderTiles();
renderDetail();
</script>
