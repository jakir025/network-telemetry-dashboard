<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Fabric - Device Inventory</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0056b3;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
        }
        .topology-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lab Fabric</h1>
        <p>Live device inventory pulled via NAPALM across a mixed Cisco IOS, NX-OS, and Arista EOS lab.</p>
        <p>Pulled via <strong>nornir_napalm.napalm_get</strong></p>
        <p>4 hosts &middot; facts, interfaces, interfaces_ip</p>
        
        <h2>Network Topology Screenshot</h2>
        <img class="topology-image" src="network_topology.png" alt="Network Topology Diagram">
    </div>
</body>
</html>
